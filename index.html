<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROF2 | Streamer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #020812;
    color: white;
    overflow-x: hidden;
}

/* =========================
   SPACE BACKGROUND
========================= */

.space {
    position: fixed;
    inset: 0;
    z-index: -10;
    background:
        radial-gradient(circle at 20% 20%, #082c4f 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, #10183c 0%, transparent 35%),
        linear-gradient(180deg, #020812, #03050d 70%, #010207);
}

.stars,
.stars::before,
.stars::after {
    position: absolute;
    inset: 0;
    content: "";
    background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, #71dfff 1px, transparent 1px),
        radial-gradient(circle, white 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px, 210px 210px;
    background-position: 0 0, 30px 60px, 80px 20px;
    opacity: .55;
}

.stars::before {
    animation: starsMove 35s linear infinite;
    opacity: .25;
}

.stars::after {
    animation: starsMove 60s linear infinite reverse;
    opacity: .2;
}

@keyframes starsMove {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(300px);
    }
}

/* =========================
   NAVBAR
========================= */

.navbar {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1100px, 94%);
    height: 70px;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background: rgba(2, 25, 48, .92);
    border: 1px solid rgba(76, 197, 255, .35);
    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(0, 130, 255, .18),
        inset 0 0 20px rgba(0, 140, 255, .05);

    backdrop-filter: blur(12px);
}

.logo-mini {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo-mini img {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #55dfff;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 7px;
    direction: rtl;
}

.nav-links a {
    text-decoration: none;
    color: #dcefff;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14px;
    transition: .25s;
}

.nav-links a:hover {
    background: #064c78;
    color: white;
    box-shadow: 0 0 15px rgba(41, 185, 255, .3);
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 100vh;
    padding-top: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.hero-content {
    width: min(1000px, 92%);
    text-align: center;
}

.hero-logo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #5fe4ff;

    box-shadow:
        0 0 20px #0b8ac4,
        0 0 60px rgba(0, 170, 255, .3);

    animation: logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

.hero h1 {
    margin-top: 25px;
    font-size: clamp(42px, 8vw, 85px);
    letter-spacing: 10px;
    text-shadow: 0 0 30px #159ddd;
}

.hero p {
    margin-top: 12px;
    color: #94c9e5;
    font-size: 18px;
}

/* =========================
   FALLING CARS
========================= */

.car {
    position: fixed;
    z-index: -2;
    width: 180px;
    pointer-events: none;
    filter:
        drop-shadow(0 0 12px rgba(255,255,255,.8))
        drop-shadow(0 0 25px #28baff);
    opacity: .85;
}

.car1 {
    top: -250px;
    left: 8%;
    animation: meteor1 10s linear infinite;
}

.car2 {
    top: -300px;
    left: 58%;
    animation: meteor2 13s linear infinite 4s;
}

.car3 {
    top: -300px;
    left: 82%;
    width: 150px;
    animation: meteor3 11s linear infinite 7s;
}

@keyframes meteor1 {
    0% {
        transform: translate(0,0) rotate(7deg);
    }
    100% {
        transform: translate(450px,130vh) rotate(20deg);
    }
}

@keyframes meteor2 {
    0% {
        transform: translate(0,0) rotate(-8deg);
    }
    100% {
        transform: translate(-500px,130vh) rotate(-25deg);
    }
}

@keyframes meteor3 {
    0% {
        transform: translate(0,0) rotate(8deg);
    }
    100% {
        transform: translate(-300px,130vh) rotate(-10deg);
    }
}

/* =========================
   CONTENT
========================= */

.section {
    width: min(1000px, 92%);
    margin: 0 auto 35px;
    padding: 35px;
    background: rgba(4, 18, 32, .82);
    border: 1px solid rgba(67, 190, 255, .2);
    border-radius: 22px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 35px rgba(0, 100, 180, .08);
}

.section-title {
    font-size: 25px;
    margin-bottom: 25px;
    color: #65ddff;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat {
    text-align: center;
    padding: 25px 15px;
    background: rgba(0, 30, 55, .75);
    border: 1px solid rgba(80, 210, 255, .18);
    border-radius: 16px;
}

.stat-number {
    font-size: 32px;
    font-weight: bold;
    color: #63ddff;
}

.stat-label {
    margin-top: 8px;
    color: #91aac0;
}

/* =========================
   STREAM INFO
========================= */

.stream-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.info-box {
    background: rgba(0, 28, 50, .75);
    border-radius: 15px;
    padding: 22px;
    border: 1px solid rgba(74, 191, 255, .18);
}

.info-box span {
    display: block;
    color: #7794a9;
    font-size: 13px;
    margin-bottom: 8px;
}

.info-box strong {
    font-size: 18px;
}

/* =========================
   SUB BADGES
========================= */

.badges {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    align-items: center;
}

.badge {
    position: relative;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background: rgba(0, 22, 40, .7);
    border: 1px solid rgba(80, 190, 255, .18);
    border-radius: 14px;

    animation: badgeFloat 2.5s ease-in-out infinite;
}

.badge:nth-child(2) { animation-delay: .2s; }
.badge:nth-child(3) { animation-delay: .4s; }
.badge:nth-child(4) { animation-delay: .6s; }
.badge:nth-child(5) { animation-delay: .8s; }
.badge:nth-child(6) { animation-delay: 1s; }

.badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transform: scale(1.8);
    filter: drop-shadow(0 0 12px rgba(50,210,255,.6));
}

.badge::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    transform: translateX(-120%);
    animation: shine 2.8s infinite;
}

.badge:nth-child(2)::after { animation-delay: .3s; }
.badge:nth-child(3)::after { animation-delay: .6s; }
.badge:nth-child(4)::after { animation-delay: .9s; }
.badge:nth-child(5)::after { animation-delay: 1.2s; }
.badge:nth-child(6)::after { animation-delay: 1.5s; }

@keyframes badgeFloat {
    0%,100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 0 rgba(50,200,255,0);
    }

    50% {
        transform: translateY(-7px) scale(1.04);
        box-shadow: 0 0 22px rgba(50,200,255,.25);
    }
}

@keyframes shine {
    0% {
        transform: translateX(-120%);
    }

    50%,100% {
        transform: translateX(120%);
    }
}

.tier {
    position: absolute;
    bottom: 5px;
    z-index: 2;
    font-size: 11px;
    color: white;
    background: rgba(0,0,0,.55);
    padding: 3px 8px;
    border-radius: 8px;
}

/* =========================
   TOP GIFTERS
========================= */

.gifters {
    display: grid;
    gap: 12px;
}

.gifter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 17px 20px;
    border-radius: 13px;
    background: rgba(0, 27, 49, .75);
    border: 1px solid rgba(74, 191, 255, .15);
}

.gifter-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.rank {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #073c61;
    color: #72ddff;
    font-weight: bold;
}

.amount {
    color: #64dcff;
    font-weight: bold;
}

/* =========================
   LINKS
========================= */

.links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.link {
    display: block;
    padding: 17px;
    text-align: center;
    text-decoration: none;
    color: white;
    border-radius: 12px;
    background: #062b47;
    border: 1px solid rgba(70, 190, 255, .2);
    transition: .25s;
}

.link:hover {
    transform: translateY(-3px);
    background: #07466f;
    box-shadow: 0 0 20px rgba(30,170,255,.2);
}

/* =========================
   DONATION
========================= */

.donation {
    text-align: center;
}

.donation a {
    display: inline-block;
    padding: 16px 30px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #075083, #0a76b4);
    box-shadow: 0 0 20px rgba(0,130,220,.2);
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 45px 20px;
    color: #607b8d;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 700px) {

    .navbar {
        height: auto;
        min-height: 65px;
        padding: 10px;
        flex-direction: column;
        gap: 8px;
    }

    .nav-links {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    .nav-links a {
        padding: 8px 9px;
        font-size: 12px;
    }

    .hero {
        padding-top: 170px;
    }

    .hero-logo {
        width: 120px;
        height: 120px;
    }

    .section {
        padding: 22px 15px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .stream-info {
        grid-template-columns: 1fr;
    }

    .badges {
        grid-template-columns: repeat(3, 1fr);
    }

    .links {
        grid-template-columns: 1fr;
    }

    .car {
        width: 120px;
    }
}
</style>
</head>
