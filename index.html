<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROF</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-bottom: 25px;
            background: #181818;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            box-shadow: 0 0 40px #ffffff20;
        }

        h1 {
            font-size: 55px;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        p {
            color: #999;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .links a {
            text-decoration: none;
            color: white;
            background: #151515;
            padding: 17px;
            border-radius: 12px;
            transition: 0.3s;
            border: 1px solid #292929;
        }

        .links a:hover {
            transform: scale(1.03);
            background: #222;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">B</div>

        <h1>BROF</h1>

        <p>Streamer</p>

        <div class="links">
            <a href="#">Kick</a>
            <a href="#">YouTube</a>
            <a href="#">TikTok</a>
            <a href="#">Instagram</a>
        </div>

    </div>

</body>
</html>
